# -------------------------------------------------------------------------------------------------
# Local run of the purge engine. Both entry points are READ-ONLY at this stage â€” nothing deletes.
#
#   mvn -q clean package -DskipTests
#
#   # what a purge would select, and the manifest an approval would be given against
#   spark-submit --class com.bnp.str.purge.job.SimulationDriver \
#                target/str-purge-engine.jar localRun/purge/application.conf
#
#   # just the raw inventory of the scope
#   spark-submit --class com.bnp.str.purge.job.InventoryDriver \
#                target/str-purge-engine.jar localRun/purge/application.conf
#
# Paths are relative to the project root, so run it from there. See
# docs/purge/TECHNICAL_SPECIFICATION.md Â§10 for the complete configuration reference.
# -------------------------------------------------------------------------------------------------

purge_app {

  # ---- what this run is ------------------------------------------------------------------------
  request {
    id        = "PRG-LOCAL-0001"

    # SIMULATE (default, deletes nothing) | EXECUTE (replays manifestRunId) |
    # SIMULATE_AND_EXECUTE (both in one submission, with nobody looking in between).
    mode          = "SIMULATE"
    # EXECUTE only: the simulation run whose manifest is replayed. The SIMULATE run logs it.
    manifestRunId = ""
    requester = "j03627"
    # TWIST knows the requester's LDAP groups and injects them here. Without them PC08 reports
    # UNKNOWN rather than passing â€” the engine has no directory of its own to guess with.
    requesterGroups = [ "grp_str_projection" ]
    # The date every retention is measured against. Pinned so a simulation and the execution that
    # replays it judge the same objects; omit it and the system date is used.
    #
    # Dated forward on purpose in this fixture: the run below is an as-of 2026Q3 projection, and a
    # one-quarter retention only lets it go once that quarter is behind us. Set it to a date before
    # 2026-12-30 and watch PC01 block the whole run instead â€” that is the engine refusing to delete
    # data that is still inside its retention, which is the behaviour worth seeing at least once.
    asOfDate  = "2027-01-15"
    comment   = "Local rehearsal: purge one projection run"
  }

  # ---- WHICH ENGINE, and WHICH RUN of it -------------------------------------------------------
  #
  # Most engines on Promethee partition their output by RUN, not by date: one projection run writes
  # `runId=<uuid>` into thirty-odd tables at once, and those partitions are one thing â€” produced
  # together, meaningful together, purged together or not at all.
  #
  # So a purge names a run, and the run's OWN configuration file â€” the one the engine was launched
  # with, which TWIST already keeps â€” is what says what it produced. Nothing is guessed from a
  # naming convention: the tables, the database, the run id, the output folders and the shared
  # inputs all come out of that file.
  engine {
    name = "projection"

    # The configuration(s) of the run(s) to purge. TWIST writes one entry per run the user selected.
    #
    # EVERYTHING else comes out of that file: the run id, the output tables, the shared inputs, and
    # the DATABASE (output.database.name). Where that database lives is then asked of the metastore.
    # So there is no database name and no path to configure here, and nothing to drift.
    #
    # The RUN CATALOGUE takes this too — it needs to know which database to list, and reads it from
    # a run of that database rather than being told a second time.
    runConfPaths = [ "localRun/purge/input/projection/conf.properties" ]
  }

  # ---- what to look at -------------------------------------------------------------------------
  scan {
    # Containment boundary — the one path that IS written by hand, on purpose. It is a safety
    # limit rather than a lookup: it says what this engine may never step outside of, and deriving
    # it from the same catalogue it is meant to constrain would defeat it.
    # On the cluster: /Projects/STCreditRisk_STE/hive/databases
    allowedRoots = [ "localRun/purge/input" ]

    # What this run inventories â€” the database the engine writes into.
    roots = [ "localRun/purge/input/projection/dbprojection.db" ]

    # Metastore side of the same scope. Empty = path-only scan (no metastore needed).
    databases = []
    tables    = []

    # `<table>/runId=<uuid>` is two levels below the database root; leave headroom for a deeper
    # layout, since a truncated walk reports the sub-tree from a NameNode summary rather than
    # under-reporting it.
    maxDepth = 6

    parallelism    = 8
    followSymlinks = false
  }

  # ---- the retention referential ---------------------------------------------------------------
  # source = conf  -> the rules below;  source = table -> read from `table` instead.
  # A candidate matching NO rule is selected only if someone picked it explicitly, and PC01 blocks
  # it: the absence of a policy is never a licence to delete.
  purge_policy {
    source = "conf"
    table  = "dbprojection.purge_policy"

    rules = [
      {
        policyId        = "P-PROJECTION-RUN"
        domain          = "PROJECTION"
        pathPattern     = "localRun/purge/input/projection/dbprojection.db/*"
        # No dateColumn: a projection partition is a run id, not a date. The age comes from the
        # run's own as-of quarter, which the engine configuration declares and which the scope
        # carries through â€” see business_date_source = RUN in the manifest.
        dateColumn      = ""
        retentionValue  = 1
        retentionUnit   = "QUARTER"
        # How many runs of a table survive whatever their age. 0 here because the operator names
        # the run and PC01 governs whether it may go; set it to 1 to make PC06 refuse to delete the
        # most recent run of a table no matter what was selected â€” which is what you want once a
        # perimeter goes into production.
        keepMinVersions = 0
        strategy        = "TRASH"
        legalHold       = false
        archiveRequired = false
        ownerGroup      = "grp_str_projection"
      }
    ]
  }

  # ---- extra hand-picked selection (optional, on top of the engine scope) -----------------------
  purge_scope {
    enable     = false
    paths      = []
    partitions = []
  }

  # ---- outputs ---------------------------------------------------------------------------------
  # What the IHM's scope screen reads: every run of the engine still on disk, with its size.
  purge_run_catalog {
    enable       = true
    format       = "orc"
    path         = "localRun/purge/output"
    tableName    = "purge_run_catalog"
    numPartition = 1
    mode         = "Overwrite"
  }

  purge_inventory {
    enable       = true
    format       = "orc"
    path         = "localRun/purge/output"
    tableName    = "purge_inventory"
    numPartition = 1
    mode         = "Overwrite"
  }

  purge_catalog {
    # Off by default locally: with databases = [] there is nothing to read.
    enable       = false
    format       = "orc"
    path         = "localRun/purge/output"
    tableName    = "purge_catalog"
    numPartition = 1
    mode         = "Overwrite"
  }

  purge_manifest {
    enable       = true
    format       = "orc"
    path         = "localRun/purge/output"
    tableName    = "purge_manifest"
    numPartition = 1
    mode         = "Overwrite"
    partitionBy  = [ "purge_date", "run_id" ]
    # Set to use a query from sql_queries.path instead of the built-in selection.
    queryName    = ""
  }

  # The shared STR run_history. The projection engine keeps its OWN history
  # (projection.history.table.name in the run conf), which the engine reader adds automatically â€”
  # that is where "is this run still going?" is actually answered.
  # run_history { root = "localRun/run_history" }

  sql_queries { path = "localRun/purge/sql/queries.sql.conf" }

  # ---- local run only --------------------------------------------------------------------------
  # A laptop starts with an empty in-memory metastore, so a database location cannot be looked up
  # the way it is on the cluster. These entries fill that metastore in, which keeps the resolution
  # path identical in both places: the engine always asks the catalogue. Ignored on a cluster — a
  # purge engine that could create databases on Promethee is not what anyone wants.
  technical {
    localDatabases = [
      { name = "dbprojection", location = "localRun/purge/input/projection/dbprojection.db" }
    ]
  }

  # ---- the controls ----------------------------------------------------------------------------
  # A blocking control that fires removes the object from what may be deleted, and no approval
  # overrides it. PC03, PC09 and PC12 cannot be switched off: PurgeGuard re-checks them in code at
  # P4, so a report that omitted them would understate what the run actually does.
  controls {
    enabled            = true
    maxFindingsPerRule = 200
    htmlPath           = "localRun/purge/reports/PRG-LOCAL-0001.html"

    # A policy that matched but whose retention is not reached blocks. An object NO policy matched
    # does NOT block (see no_retention_policy below): the business owns its data and decides what to
    # purge, so the deny boundary is "it must have been explicitly named" â€” which a run scope is.
    # Set blockWithoutPolicy = true for a perimeter that wants the stricter default-deny reading.
    retention_not_reached { enabled = true, blockWithoutPolicy = false }
    legal_hold            { enabled = true }
    path_out_of_scope     { enabled = true }   # locked
    active_run            { enabled = true, minQuietMinutes = 60 }
    # Point this at the lineage referential once there is one; until then PC05 reports UNKNOWN
    # rather than passing, and the report says so above everything else.
    downstream_dependency { enabled = true, referential = "" }
    min_versions_kept     { enabled = true }
    no_archive            { enabled = true }
    not_authorized        { enabled = true }
    blast_radius          { enabled = true }   # locked
    shared_input          { enabled = true }
    no_retention_policy   { enabled = true }   # reports what PC01 no longer blocks
    recently_accessed     { enabled = true, recentAccessDays = 30 }
    hive_metadata_orphan  { enabled = true }
    manifest_drift        { enabled = true }   # locked, evaluated at execution
    already_absent        { enabled = true }   # evaluated at execution
  }

  # ---- ceilings (PC09 now, PurgeGuard in code at P4) -------------------------------------------
  guard {
    maxBytes            = 5497558138880   # 5 TiB
    maxObjects          = 50000
    maxPercentOfTable   = 50
    manifestMaxAgeHours = 72
  }

  # ---- how the deletion is carried out ---------------------------------------------------------
  execution {
    # TRASH keeps the data recoverable for fs.trash.interval, which on Promethee is 7 days (Q5).
    defaultStrategy = "TRASH"

    # Every STR table is EXTERNAL with external.table.purge = TRUE (Q8), so DROP PARTITION would
    # delete the data itself, through Hive and possibly past Trash. The executor therefore moves the
    # data to Trash FIRST and drops the partition second, against a location that is already empty:
    # the metadata stays consistent and the 7-day window still applies.
    dropHivePartition = true

    # The same, one level up, for a table-granular engine (the classic simulator): a run IS its
    # tables, so the table itself is dropped once its data is in Trash. Set to false for a perimeter
    # that wants the data gone and the table definition kept -- at the cost of a registered table
    # pointing at nothing, which is what PC11 warns about.
    dropHiveTable = true

    # A failed object does not stop the others; the run ends PARTIAL and replaying it is safe.
    stopOnFirstError = false

    # If Trash is unavailable, FAIL rather than fall back to an unrecoverable delete.
    failWhenTrashUnavailable = true

    logEveryNObjects = 100
  }

  # One row per object touched: the record that answers "what exactly did that purge remove?".
  purge_detail {
    enable = true
    root   = "localRun/purge/output/purge_detail"
    # database = "dbprojection"
    table  = "purge_detail"
  }

  # This purge appears in the shared run_history like any other engine, under module_name = purge.
  audit {
    enabled = true
    root    = "localRun/purge/output/run_history"
    motor   = "purge"
  }
}


