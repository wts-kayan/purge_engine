# -------------------------------------------------------------------------------------------------
# Local run of the purge engine against the CLASSIC SIMULATOR — the table-granular engine, where a
# run IS its tables rather than one partition of each.
#
#   mvn -q clean package -DskipTests
#
#   # what a purge of this simulation would remove, and the manifest an approval is given against
#   spark-submit --class com.bnp.str.purge.job.SimulationDriver \
#                target/str-purge-engine.jar localRun/purge/application_simulator.conf
#
#   # the same, and then actually remove it. Set request.mode = "SIMULATE_AND_EXECUTE" first, and
#   # give the run a Trash window - a laptop has fs.trash.interval = 0, and this engine FAILS an
#   # object rather than falling back to an unrecoverable delete, so without it every object fails
#   # and the run ends PARTIAL. That refusal is the design working, not a fixture problem.
#   spark-submit --conf spark.hadoop.fs.trash.interval=10080 \
#                --class com.bnp.str.purge.job.MainDriver \
#                target/str-purge-engine.jar localRun/purge/application_simulator.conf
#
#   # -> PURGE SUCCESS - 3 object(s) removed, 228 B freed [TABLE_DROPPED=3]
#   # The fixture is version-controlled: restore it with
#   #   git checkout localRun/purge/input/simulator_classic
#
# Paths are relative to the project root, so run it from there. The projection rehearsal lives in
# `application.conf` beside this one; see docs/purge/simulator_classic_analysis.md for what this
# engine's configuration says and why the two differ.
# -------------------------------------------------------------------------------------------------

purge_app {

  request {
    id        = "PRG-LOCAL-SIM-0001"

    # SIMULATE (default, deletes nothing) | EXECUTE (replays manifestRunId) | SIMULATE_AND_EXECUTE.
    # Change to SIMULATE_AND_EXECUTE to watch the tables actually go.
    mode          = "SIMULATE"
    manifestRunId = ""
    requester       = "j03627"
    requesterGroups = [ "grp_str_simulateur" ]

    # The simulation is an as-of 2026Q2 run, so anything past 2026-09-30 puts it outside a one-quarter
    # retention. Set this before that date and PC01 blocks the run instead.
    asOfDate  = "2027-01-15"
    comment   = "Local rehearsal: purge one classic-simulator run"
  }

  # ---- WHICH ENGINE, and WHICH RUN of it -------------------------------------------------------
  #
  # The run configuration is the REAL one TWIST generated (simulation 4363, run
  # 5bbad7c8-…), used unedited. That is the point of §14quater: the file names its tables and its
  # database, and where those tables actually SIT is asked of the metastore — so the same file works
  # on a laptop and on Promethee without a single path being rewritten.
  engine {
    name         = "simulator_classic"
    runConfPaths = [ "localRun/purge/input/simulator_classic/conf.properties" ]
  }

  scan {
    # The containment boundary. On the cluster: /Projects/STCreditRisk_STE/Simulateur_Production.
    allowedRoots = [ "localRun/purge/input/simulator_classic" ]

    # Where this engine's tables live — NOT under the database, which is the whole difficulty of
    # this engine.
    #
    # The engine's own tables (run_history, run_metadata, the shared results table) sit under this
    # root deliberately, as they do on the cluster. An engine-driven run does not select them —
    # naming a run selects that run's tables and nothing else — so what this fixture shows is the
    # SCOPE being right. PC14 is the second line: enable `purge_scope` below with one of those paths
    # and watch it refuse. A sibling simulation is here for the same reason: to show that a purge
    # removes the run it was given and not its neighbours.
    roots = [ "localRun/purge/input/simulator_classic/out" ]

    # The metastore side of the same scope, and it is NOT optional for this engine. A table-granular
    # candidate is recognised as a whole table by its path being exactly a registered table's
    # location — which is what tells the executor to DROP TABLE rather than drop a partition, and
    # what keeps PC09 from reading "this removes 100% of the table" as a blast radius. With no
    # database listed, nothing resolves and every candidate is an anonymous directory.
    databases = [ "dbsimulateur" ]
    tables    = []

    # `out/facs_<scenario>/<table>` is three levels down; leave headroom.
    #
    # The directory names are abbreviated (`out/facs_c` for
    # `Output_Simulateur/facs_<scenario>_<t>`) for one unglamorous reason: a real simulator table
    # name is ~130 characters, and the full cluster tree takes the fixture past the 260-character
    # path limit Windows still enforces. The TABLE names are the real ones, unabridged, because they
    # are what the descriptor reads and lower-cases; the parents are only scenery.
    maxDepth = 6

    parallelism    = 8
    followSymlinks = false
  }

  # ---- the retention referential ---------------------------------------------------------------
  purge_policy {
    source = "conf"
    table  = "dbsimulateur.purge_policy"

    rules = [
      {
        policyId        = "P-SIMULATOR-RUN"
        domain          = "SIMULATOR"
        pathPattern     = "localRun/purge/input/simulator_classic/out/*"
        # A simulator table is a run, not a date. The age comes from the run's as-of quarter, which
        # the run configuration declares — business_date_source = RUN in the manifest.
        dateColumn      = ""
        retentionValue  = 1
        retentionUnit   = "QUARTER"
        keepMinVersions = 0
        strategy        = "TRASH"
        legalHold       = false
        archiveRequired = false
        ownerGroup      = "grp_str_simulateur"
      }
    ]
  }

  purge_scope {
    enable     = false
    paths      = []
    partitions = []
  }

  # ---- outputs ---------------------------------------------------------------------------------
  #
  # The run catalogue is OFF here. It recovers a run's identity from the directory name, which for a
  # table-granular engine is the TABLE name — usable as a label, but it does not join back to a run
  # id, and nothing in these table names carries one. That is the open question in
  # docs/purge/simulator_classic_analysis.md §6.1, and switching this on before it is answered would
  # produce a list that looks authoritative and is not.
  purge_run_catalog {
    enable       = false
    format       = "orc"
    path         = "localRun/purge/output_simulator"
    tableName    = "purge_run_catalog"
    numPartition = 1
    mode         = "Overwrite"
  }

  purge_inventory {
    enable       = true
    format       = "orc"
    path         = "localRun/purge/output_simulator"
    tableName    = "purge_inventory"
    numPartition = 1
    mode         = "Overwrite"
  }

  purge_catalog {
    enable       = true
    format       = "orc"
    path         = "localRun/purge/output_simulator"
    tableName    = "purge_catalog"
    numPartition = 1
    mode         = "Overwrite"
  }

  purge_manifest {
    enable       = true
    format       = "orc"
    path         = "localRun/purge/output_simulator"
    tableName    = "purge_manifest"
    numPartition = 1
    mode         = "Overwrite"
    partitionBy  = [ "purge_date", "run_id" ]
    queryName    = ""
  }

  sql_queries { path = "localRun/purge/sql/queries.sql.conf" }

  # ---- local run only --------------------------------------------------------------------------
  #
  # A laptop starts with an empty metastore. On the cluster these entries do nothing at all.
  #
  # The TABLES matter more here than the database does, and that is the difference from the
  # projection rehearsal. This engine's tables are EXTERNAL and sit nowhere near `dbsimulateur.db`,
  # so the engine asks the metastore for each TABLE's own location. Registering only the database
  # would leave it guessing `<database>/<table>` — the wrong answer, and a rehearsal that passed
  # while the cluster found nothing.
  #
  # Note what is NOT registered: `..._fac_measure_bytermoutput_nosecto`. The engine scopes every
  # `_nosecto` twin because any output may exist twice, and a twin that was never written resolves
  # to no location, matches nothing, and never reaches the manifest. This fixture is how that stays
  # true.
  technical {
    localDatabases = [
      { name = "dbsimulateur", location = "localRun/purge/input/simulator_classic/dbsimulateur.db" },
      # the purge engine's own database, holding purge_detail and run_history
      { name = "dbpurge",      location = "localRun/purge/output_simulator" }
    ]

    localTables = [
      # the run's own output — what a purge of this simulation removes
      { database = "dbsimulateur"
        name     = "stapo_sp_starting_point_ifrs9_no_adjust_2026q2_260624_v1_py_10551_pa_input_ste_ifrs926q2_sicr3_v2_20260904_fac"
        location = "localRun/purge/input/simulator_classic/out/facs_c/stapo_sp_starting_point_ifrs9_no_adjust_2026q2_260624_v1_py_10551_pa_input_ste_ifrs926q2_sicr3_v2_20260904_fac" },

      { database = "dbsimulateur"
        name     = "stapo_sp_starting_point_ifrs9_no_adjust_2026q2_260624_v1_py_10551_pa_input_ste_ifrs926q2_sicr3_v2_20260904_fac_nosecto"
        location = "localRun/purge/input/simulator_classic/out/facs_c/stapo_sp_starting_point_ifrs9_no_adjust_2026q2_260624_v1_py_10551_pa_input_ste_ifrs926q2_sicr3_v2_20260904_fac_nosecto" },

      { database = "dbsimulateur"
        name     = "stapo_sp_starting_point_ifrs9_no_adjust_2026q2_260624_v1_py_10551_pa_input_ste_ifrs926q2_sicr3_v2_20260904_fac_measure_bytermoutput"
        location = "localRun/purge/input/simulator_classic/out/facs_c/stapo_sp_starting_point_ifrs9_no_adjust_2026q2_260624_v1_py_10551_pa_input_ste_ifrs926q2_sicr3_v2_20260904_fac_measure_bytermoutput" },

      # the engine's own tables — never purged, whoever asks (PC14)
      { database = "dbsimulateur", name = "run_history"
        location = "localRun/purge/input/simulator_classic/out/engine/run_history" },
      { database = "dbsimulateur", name = "run_metadata"
        location = "localRun/purge/input/simulator_classic/out/engine/run_metadata" },
      { database = "dbsimulateur", name = "simulation_results_fac_partitioned_full"
        location = "localRun/purge/input/simulator_classic/out/engine/simulation_results_fac_partitioned_full" },

      # a neighbouring simulation, which this purge must leave alone
      { database = "dbsimulateur"
        name     = "stapo_sp_other_simulation_py_10480_pa_input_ste_v1_20260812_fac"
        location = "localRun/purge/input/simulator_classic/out/facs_c/stapo_sp_other_simulation_py_10480_pa_input_ste_v1_20260812_fac" }
    ]
  }

  # ---- the controls ----------------------------------------------------------------------------
  controls {
    enabled            = true
    maxFindingsPerRule = 200
    htmlPath           = "localRun/purge/reports/PRG-LOCAL-SIM-0001.html"

    retention_not_reached { enabled = true, blockWithoutPolicy = false }
    legal_hold            { enabled = true }
    path_out_of_scope     { enabled = true }   # locked
    active_run            { enabled = true, minQuietMinutes = 60 }
    downstream_dependency { enabled = true, referential = "" }
    min_versions_kept     { enabled = true }
    no_archive            { enabled = true }
    not_authorized        { enabled = true }
    blast_radius          { enabled = true }   # locked
    shared_input          { enabled = true }   # what keeps run_history out of the manifest
    no_retention_policy   { enabled = true }
    recently_accessed     { enabled = true, recentAccessDays = 30 }
    hive_metadata_orphan  { enabled = true }   # fires on a whole table here, not a partition
    manifest_drift        { enabled = true }   # locked, evaluated at execution
    already_absent        { enabled = true }   # evaluated at execution
  }

  guard {
    maxBytes            = 5497558138840
    maxObjects          = 50000
    maxPercentOfTable   = 50
    manifestMaxAgeHours = 72
  }

  execution {
    defaultStrategy = "TRASH"

    dropHivePartition = true

    # A simulator run IS its tables, so the table itself goes once its data is in Trash. Both
    # projection and simulator tables are EXTERNAL with external.table.purge = TRUE, which is why
    # the data is trashed FIRST and Hive is only ever asked to drop metadata against a location that
    # is already empty.
    dropHiveTable = true

    stopOnFirstError = false
    failWhenTrashUnavailable = true
    logEveryNObjects = 100
  }

  # One row per object touched: the record that answers "what exactly did that purge remove?".
  #
  # It lives in `dbpurge`, the purge engine's OWN database, beside run_history — not in the database
  # it purges. An audit that sits inside its subject is an audit that a wide enough purge can take
  # with it, and `dbpurge` is never any engine's output, so nothing in this engine's scope can ever
  # reach it.
  purge_detail {
    enable   = true
    root     = "localRun/purge/output_simulator/purge_detail"
    database = "dbpurge"
    table    = "purge_detail"
  }

  audit {
    enabled  = true
    root     = "localRun/purge/output_simulator/run_history"
    database = "dbpurge"
    table    = "run_history"
    motor    = "purge"
  }
}
